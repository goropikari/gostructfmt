      overflow: hidden;
    }
    #graph {
      flex: 1;
    }
    #sidebar {
      width: 280px;
      background: #1a1a2e;
      border-left: 1px solid #2a2a4e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #search-wrap {
      padding: 12px;
      border-bottom: 1px solid #2a2a4e;
    }
    #search {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #3a3a5e;
      color: #e0e0e0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    #search:focus {
      border-color: #4e79a7;
    }
    #search-results {
      max-height: 140px;
      overflow-y: auto;
      padding: 4px 12px;
      border-bottom: 1px solid #2a2a4e;
      display: none;
    }
    .search-item {
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-item:hover {
      background: #2a2a4e;
    }
    #info-panel {
      padding: 14px;
      border-bottom: 1px solid #2a2a4e;
      min-height: 140px;
    }
    #info-panel h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #info-content {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }
    #info-content .field {
      margin-bottom: 5px;
    }
    #info-content .field b {
      color: #e0e0e0;
    }
    #info-content .empty {
      color: #555;
      font-style: italic;
    }
    .neighbor-link {
      display: block;
      padding: 2px 6px;
      margin: 2px 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid #333;
    }
    .neighbor-link:hover {
      background: #2a2a4e;
    }
    #neighbors-list {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 4px;
    }
    #legend-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    #legend-wrap h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }
    .legend-item:hover {
      background: #2a2a4e;
      padding-left: 4px;
    }
    .legend-item.dimmed {
      opacity: 0.35;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .legend-count {
      color: #666;
      font-size: 11px;
    }
    #stats {
      padding: 10px 14px;
      border-top: 1px solid #2a2a4e;
      font-size: 11px;
      color: #555;
    }
    #legend-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 4px 0;
    }
    #legend-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #aaa;
      user-select: none;
    }
    #legend-controls label:hover {
      color: #e0e0e0;
    }
    .legend-cb, #select-all-cb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid #3a3a5e;
      border-radius: 3px;
      background: #0f0f1a;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .legend-cb:checked, #select-all-cb:checked {
      background: #4e79a7;
      border-color: #4e79a7;
    }
    .legend-cb:checked::after, #select-all-cb:checked::after {
      content: "";
      position: absolute;
      left: 3.5px;
      top: 1px;
      width: 4px;
      height: 7px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    #select-all-cb:indeterminate {
      background: #4e79a7;
      border-color: #4e79a7;
    }
    #select-all-cb:indeterminate::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 5px;
      width: 8px;
      height: 2px;
      background: #fff;
      border: none;
      transform: none;
    }
    </style>

      "title": "references [EXTRACTED]",
      "dashes": false,

    const LEGEND = [
      {
        "cid": 0,
        "color": "#4E79A7",
        "label": "struct_literal.go",
        "count": 30,
      },
      { "cid": 1, "color": "#F28E2B", "label": "Parse", "count": 21 },
      { "cid": 2, "color": "#E15759", "label": "command.go", "count": 23 },
      { "cid": 3, "color": "#76B7B2", "label": "Plugin", "count": 13 },
      {
        "cid": 4,
        "color": "#59A14F",
        "label": "Testing Guidelines",
        "count": 10,
      },
      { "cid": 5, "color": "#EDC948", "label": "run", "count": 9 },
      { "cid": 6, "color": "#B07AA1", "label": "gostructfmt", "count": 7 },
      {
        "cid": 7,

    // HTML-escape helper — prevents XSS when injecting graph data into innerHTML
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(
        />/g,
        "&gt;",
      ).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // Build vis datasets
    const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
      id: n.id,
      label: n.label,
      color: n.color,
      size: n.size,
      font: n.font,
      title: n.title,
      _community: n.community,
      _community_name: n.community_name,
      _source_file: n.source_file,
      _file_type: n.file_type,
      _degree: n.degree,
    })));

    const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
      id: i,
      from: e.from,
      to: e.to,
      label: "",
      title: e.title,
      dashes: e.dashes,
      width: e.width,
      color: e.color,
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
    })));

    const container = document.getElementById("graph");
    const network = new vis.Network(container, {
      nodes: nodesDS,
      edges: edgesDS,
    }, {
      physics: {
        enabled: true,
        solver: "forceAtlas2Based",
        forceAtlas2Based: {
          gravitationalConstant: -60,
          centralGravity: 0.005,
          springLength: 120,
          springConstant: 0.08,
          damping: 0.4,
          avoidOverlap: 0.8,
        },
        stabilization: { iterations: 200, fit: true },
      },
      interaction: {
        hover: true,
        tooltipDelay: 100,
        hideEdgesOnDrag: true,
        navigationButtons: false,
        keyboard: false,
      },
      nodes: { shape: "dot", borderWidth: 1.5 },
      edges: {
        smooth: { type: "continuous", roundness: 0.2 },
        selectionWidth: 3,
      },
    });

    network.once("stabilizationIterationsDone", () => {
      network.setOptions({ physics: { enabled: false } });
    });

    function showInfo(nodeId) {
      const n = nodesDS.get(nodeId);
      if (!n) return;
      const neighborIds = network.getConnectedNodes(nodeId);
      const neighborItems = neighborIds.map(nid => {
        const nb = nodesDS.get(nid);
        const color = nb ? nb.color.background : "#555";
        return `<span class="neighbor-link" style="border-left-color:${
          esc(color)
        }" data-nid="${esc(nid)}">${esc(nb ? nb.label : nid)}</span>`;
      }).join("");
      document.getElementById("info-content").innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n._file_type || "unknown")}</div>
    <div class="field">Community: ${esc(n._community_name)}</div>
    <div class="field">Source: ${esc(n._source_file || "-")}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${
        neighborIds.length
          ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>`
          : ""
      }
  `;
    }

    function focusNode(nodeId) {
      network.focus(nodeId, { scale: 1.4, animation: true });
      network.selectNodes([nodeId]);
      showInfo(nodeId);
    }

    // Neighbor links use a data attribute + one delegated listener rather than an
    // inline onclick. A node id/label sourced from a document or a scraped URL
    // (graphify add) can contain a double-quote; dropping the stringified id
    // unescaped into a quoted onclick both broke every link and allowed a hostile
    // source to inject an event handler into the local report (stored XSS, #1838).
    // esc() on data-nid keeps the value inside the attribute; the listener reads it
    // back verbatim. Bound to document so it survives the innerHTML rebuild that
    // recreates #neighbors-list on each showInfo().
    document.addEventListener("click", e => {
      const el = e.target.closest(".neighbor-link");
      if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
    });

    // Track hovered node — hover detection is more reliable than click params
    let hoveredNodeId = null;
    network.on("hoverNode", params => {
      hoveredNodeId = params.node;
      container.style.cursor = "pointer";
    });
    network.on("blurNode", () => {
      hoveredNodeId = null;
      container.style.cursor = "default";
    });
    container.addEventListener("click", () => {
      if (hoveredNodeId !== null) {
        showInfo(hoveredNodeId);
        network.selectNodes([hoveredNodeId]);
      }
    });
    network.on("click", params => {
      if (params.nodes.length > 0) {
        showInfo(params.nodes[0]);
      } else if (hoveredNodeId === null) {
        document.getElementById("info-content").innerHTML =
          "<span class=\"empty\">Click a node to inspect it</span>";
      }
    });

    const searchInput = document.getElementById("search");
    const searchResults = document.getElementById("search-results");
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();
      searchResults.innerHTML = "";
      if (!q) {
        searchResults.style.display = "none";
        return;
      }
      const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q))
        .slice(0, 20);
      if (!matches.length) {
        searchResults.style.display = "none";
        return;
      }
      searchResults.style.display = "block";
      matches.forEach(n => {
        const el = document.createElement("div");
        el.className = "search-item";
        el.textContent = n.label;
        el.style.borderLeft = `3px solid ${n.color.background}`;
        el.style.paddingLeft = "8px";
        el.onclick = () => {
          network.focus(n.id, { scale: 1.5, animation: true });
          network.selectNodes([n.id]);
          showInfo(n.id);
          searchResults.style.display = "none";
          searchInput.value = "";
        };
        searchResults.appendChild(el);
      });
    });
    document.addEventListener("click", e => {
      if (!searchResults.contains(e.target) && e.target !== searchInput) {
        searchResults.style.display = "none";
      }
    });

    const hiddenCommunities = new Set();

    const selectAllCb = document.getElementById("select-all-cb");

    function updateSelectAllState() {
      const total = LEGEND.length;
      const hidden = hiddenCommunities.size;
      selectAllCb.checked = hidden === 0;
      selectAllCb.indeterminate = hidden > 0 && hidden < total;
    }

    function toggleAllCommunities(hide) {
      document.querySelectorAll(".legend-item").forEach(item => {
        hide ? item.classList.add("dimmed") : item.classList.remove("dimmed");
      });
      document.querySelectorAll(".legend-cb").forEach(cb => {
        cb.checked = !hide;
      });
      LEGEND.forEach(c => {
        if (hide) hiddenCommunities.add(c.cid);
        else hiddenCommunities.delete(c.cid);
      });
      const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
      nodesDS.update(updates);
      updateSelectAllState();
    }

    const legendEl = document.getElementById("legend");
    LEGEND.forEach(c => {
      const item = document.createElement("div");
      item.className = "legend-item";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "legend-cb";
      cb.checked = true;
      cb.addEventListener("change", (e) => {
        e.stopPropagation();
        if (cb.checked) {
          hiddenCommunities.delete(c.cid);
          item.classList.remove("dimmed");
        } else {
          hiddenCommunities.add(c.cid);
          item.classList.add("dimmed");
        }
        const updates = RAW_NODES
          .filter(n => n.community === c.cid)
          .map(n => ({ id: n.id, hidden: !cb.checked }));
        nodesDS.update(updates);
        updateSelectAllState();
      });
      item.innerHTML =
        `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
      item.prepend(cb);
      item.onclick = (e) => {
        if (e.target === cb) return;
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event("change"));
      };
      legendEl.appendChild(item);
    });
    </script>

      "confidence_score": 0.85,
      "source_file": ".github/workflows/ci.yml",
    }];
    // afterDrawing passes ctx already transformed to network coordinate space.
    // Draw node positions raw — no manual pan/zoom/DPR math needed.
    network.on("afterDrawing", function(ctx) {
      hyperedges.forEach(h => {
        const positions = h.nodes
          .map(nid => network.getPositions([nid])[nid])
          .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = "#6366f1";
        ctx.strokeStyle = "#6366f1";
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
          x: cx + (p.x - cx) * 1.15,
          y: cy + (p.y - cy) * 1.15,
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = "#4f46e5";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
      });
    });
